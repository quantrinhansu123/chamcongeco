services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      STORAGE_BACKEND: sqlite
      FACE_MODEL_DIR: /models
      FACE_DATA_DIR: /data
      FACE_ADMIN_API_KEY: ${FACE_ADMIN_API_KEY:?Set a strong admin key in .env}
      FACE_KIOSK_API_KEY: ${FACE_KIOSK_API_KEY:?Set a distinct kiosk key in .env}
      FACE_MIN_SHARPNESS: ${FACE_MIN_SHARPNESS:-40}
      FACE_MIN_BRIGHTNESS: ${FACE_MIN_BRIGHTNESS:-45}
      FACE_MAX_BRIGHTNESS: ${FACE_MAX_BRIGHTNESS:-220}
      FACE_MIN_FACE_PIXELS: ${FACE_MIN_FACE_PIXELS:-80}
    volumes:
      - runtime-data:/data
      - model-data:/models
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
volumes:
  runtime-data:
  model-data:
