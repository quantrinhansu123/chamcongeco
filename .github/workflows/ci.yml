name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
          enable-cache: true
      - run: uv sync --project backend --frozen
      - run: uv run --project backend ruff check backend/src/backend/runtime backend/scripts/download_models.py backend/scripts/import_csv.py backend/scripts/benchmark_runtime.py backend/scripts/verify_enrollment.py backend/tests/test_runtime.py backend/tests/test_import.py backend/tests/test_transport.py backend/tests/test_quality.py
      - run: uv run --project backend pytest backend/tests -q
      - name: Real ONNX and HTTP/storage smoke with public developer samples
        run: |
          uv run --project backend python backend/scripts/download_models.py
          curl --fail --location --retry 2 -o /tmp/live.jpg https://raw.githubusercontent.com/minivision-ai/Silent-Face-Anti-Spoofing/master/images/sample/image_T1.jpg
          curl --fail --location --retry 2 -o /tmp/spoof.jpg https://raw.githubusercontent.com/minivision-ai/Silent-Face-Anti-Spoofing/master/images/sample/image_F1.jpg
          uv run --project backend python backend/scripts/benchmark_runtime.py --image /tmp/live.jpg --spoof /tmp/spoof.jpg --runs 3
          uv run --project backend python backend/scripts/verify_enrollment.py --image /tmp/live.jpg
  frontend-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run lint && bun run test:unit && bun run build
        working-directory: frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser flows with fake camera and API
        working-directory: frontend
        run: |
          bun run dev --host 127.0.0.1 --strictPort > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
          node --test --test-concurrency=1 tests/*.mjs
          SMOKE_MOCK_API=1 node scripts/smoke-enrollment-worker.mjs
      - run: bun install --frozen-lockfile && bun run test:sql
        working-directory: tools
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg FACE_DOWNLOAD_MODELS=1 -f backend/Dockerfile -t attendly-api:test .
      - name: Render image, embedded models and dynamic port
        shell: bash
        run: |
          RENDER_SMOKE_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$RENDER_SMOKE_KEY"
          trap 'docker logs render-smoke; docker rm -f render-smoke' EXIT
          docker run --detach --name render-smoke -p 127.0.0.1:18081:10000 \
            -e PORT=10000 -e APP_ENV=production -e STORAGE_BACKEND=sqlite \
            -e FACE_ADMIN_API_KEY="$RENDER_SMOKE_KEY" attendly-api:test
          for i in $(seq 1 45); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' render-smoke)" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' render-smoke)" = healthy
          curl --fail --silent http://127.0.0.1:18081/readyz
      - run: docker build -f frontend/Dockerfile -t attendly-web:test .
      - name: Nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 attendly-web:test nginx -t
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
        working-directory: frontend
      - name: Production Compose, private volumes, auth and real punch through Nginx
        shell: bash
        run: |
          export FACE_ADMIN_API_KEY="$(openssl rand -hex 32)"
          export FACE_KIOSK_API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$FACE_ADMIN_API_KEY"
          echo "::add-mask::$FACE_KIOSK_API_KEY"
          export WEB_PORT=18080
          trap 'cd "$GITHUB_WORKSPACE"; docker compose logs --tail 50; docker compose down -v' EXIT
          docker compose build
          docker compose run --rm --no-deps api python scripts/download_models.py
          docker compose up -d --wait --wait-timeout 90
          curl --fail --silent http://127.0.0.1:18080/ > /tmp/attendly-index.html
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/employees)" = 401
          curl --fail --silent -H "Authorization: Bearer $FACE_KIOSK_API_KEY" http://127.0.0.1:18080/api/session
          curl --fail --location --silent -o /tmp/container-face.jpg https://raw.githubusercontent.com/minivision-ai/Silent-Face-Anti-Spoofing/master/images/sample/image_T1.jpg
          curl --fail --silent -H "Authorization: Bearer $FACE_ADMIN_API_KEY" http://127.0.0.1:18080/api/enrollment/policy > /tmp/container-policy.json
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $FACE_KIOSK_API_KEY" -F 'consent=true' -F 'image=@/tmp/container-face.jpg;type=image/jpeg' http://127.0.0.1:18080/api/enrollment/validate)" = 403
          curl --fail --silent -H "Authorization: Bearer $FACE_ADMIN_API_KEY" -F 'consent=true' -F 'pose=front' -F 'image=@/tmp/container-face.jpg;type=image/jpeg' http://127.0.0.1:18080/api/enrollment/validate > /tmp/container-front.json
          curl --fail --silent -H "Authorization: Bearer $FACE_ADMIN_API_KEY" -F 'consent=true' -F 'pose=left' -F 'image=@/tmp/container-face.jpg;type=image/jpeg' -F 'reference=@/tmp/container-face.jpg;type=image/jpeg' http://127.0.0.1:18080/api/enrollment/validate > /tmp/container-side.json
          curl --fail --silent -H "Authorization: Bearer $FACE_ADMIN_API_KEY" http://127.0.0.1:18080/api/employees > /tmp/container-before-enrollment.json
          python3 -c "import json; policy=json.load(open('/tmp/container-policy.json')); front=json.load(open('/tmp/container-front.json')); side=json.load(open('/tmp/container-side.json')); assert policy['version']=='face-quality-v2' and policy['crop_size']==128; assert front['valid'] and not front['reference_checked']; assert side['valid'] and side['reference_checked']; assert json.load(open('/tmp/container-before-enrollment.json'))==[]; print('Production preflight/policy/admin role passed without creating profiles')"
          docker compose exec -T api python -c "from pathlib import Path; assert not list(Path('/data/photos').rglob('*.jpg')); print('Preflight persisted no photos')"
          curl --fail --silent -H "Authorization: Bearer $FACE_ADMIN_API_KEY" -F 'name=Synthetic CI Container' -F 'consent=true' -F 'image=@/tmp/container-face.jpg;type=image/jpeg' http://127.0.0.1:18080/api/employees > /tmp/container-enrollment.json
          REQUEST_ID="$(cat /proc/sys/kernel/random/uuid)"
          curl --fail --silent -H "Authorization: Bearer $FACE_KIOSK_API_KEY" -F "request_id=$REQUEST_ID" -F 'image=@/tmp/container-face.jpg;type=image/jpeg' http://127.0.0.1:18080/api/recognize > /tmp/container-punch.json
          curl --fail --silent -H "Authorization: Bearer $FACE_KIOSK_API_KEY" -F "request_id=$REQUEST_ID" -F 'image=@/tmp/container-face.jpg;type=image/jpeg' http://127.0.0.1:18080/api/recognize > /tmp/container-retry.json
          python3 -c "import json; first=json.load(open('/tmp/container-punch.json')); retry=json.load(open('/tmp/container-retry.json')); assert first['status']=='confirmed' and len(first['attendance_updated'])==1; assert retry['attendance']==first['attendance'] and retry['replayed']; print('Production proxy/auth/ONNX/storage/receipt passed')"
          docker compose exec -T api python -c "from pathlib import Path; assert len(list(Path('/data/photos').rglob('*.jpg')))==1; print('Evidence persisted once in private volume')"
          export FRONTEND_URL=http://127.0.0.1:18080
          export SMOKE_ADMIN_API_KEY="$FACE_ADMIN_API_KEY"
          cd frontend
          node scripts/smoke-enrollment-worker.mjs
